name: Release APK

# A ogni tag vX.Y.Z: APK firmato con la chiave nei secrets, allegato alla release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila APK firmato
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks"
          chmod +x gradlew && ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "sveglia-dura-$GITHUB_REF_NAME.apk"
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Sveglia Dura $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "sveglia-dura-$GITHUB_REF_NAME.apk" --clobber
